<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1626"/>
      <stop offset="1" stop-color="#0e0f16"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.48" r="0.55">
      <stop offset="0" stop-color="#ffcf3f" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffcf3f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffbe0"/>
      <stop offset=".5" stop-color="#ffd23c"/>
      <stop offset="1" stop-color="#ff8a00"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#sky)"/>
  <!-- 道路と横断歩道 -->
  <rect y="360" width="1200" height="270" fill="#36333f"/>
  <rect y="356" width="1200" height="6" fill="#ffffff" opacity=".35"/>
  <g fill="#ffffff" opacity=".18">
    <rect x="80" y="390" width="70" height="200"/><rect x="190" y="390" width="70" height="200"/>
    <rect x="940" y="390" width="70" height="200"/><rect x="1050" y="390" width="70" height="200"/>
  </g>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <!-- 射程の楕円 -->
  <ellipse cx="600" cy="470" rx="420" ry="120" fill="#ffd54a" fill-opacity=".12" stroke="#ffd54a" stroke-width="5"/>
  <!-- タイトル -->
  <text x="600" y="250" text-anchor="middle" font-family="'Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" font-weight="900" font-size="200"
        fill="#f4efe4" stroke="#5a1d10" stroke-width="10" paint-order="stroke">老害<tspan fill="url(#gold)" stroke="#6a3a00">GO</tspan></text>
  <text x="600" y="330" text-anchor="middle" font-family="'Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" font-weight="800" font-size="40" fill="#ffe680">時間を止めて、渋谷の群衆を一網打尽</text>
  <text x="600" y="520" text-anchor="middle" font-size="120">👴</text>
  <text x="600" y="600" text-anchor="middle" font-family="'Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" font-weight="900" font-size="34" fill="#ffffff" opacity=".85">極 ・ 超老害RUSH ・ 伝説の一撃</text>
</svg>
